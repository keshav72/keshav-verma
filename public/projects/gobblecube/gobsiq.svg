lvetica Neue', Arial, sans-serif" font-size="18" font-weight="650" fill="#1F2937" text-anchor="start" letter-spacing="0">Shift spend to the backup SKU</text><rect x="744" y="240" width="236" height="260" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" opacity="1"/><text x="764" y="272" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#6B7280" text-anchor="start" letter-spacing="0">Conversions</text><path d="M770,340 C785.0,340 785.0,330 800,330 C815.0,330 815.0,345 830,345 C845.0,345 845.0,335 860,335 C875.0,335 875.0,400 890,400 C905.0,400 905.0,430 920,430 C935.0,430 935.0,425 950,425" fill="none" stroke="#0F766E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="880" y1="300" x2="880" y2="460" stroke="#D97706" stroke-width="2" stroke-dasharray="4 5"/><text x="886" y="316" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#D97706" text-anchor="start" letter-spacing="0">Stock-out</text><rect x="764" y="462" width="196" height="26" rx="13.0" fill="#EEF7F5" opacity="1"/><text x="862.0" y="479.68" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#0F766E" text-anchor="middle" letter-spacing="0">Owner assigned</text></svg>